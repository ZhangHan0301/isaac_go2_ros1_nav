seed: 42
device: cuda:0
num_steps_per_env: 10
max_iterations: 10000
empirical_normalization: false
policy:
  class_name: ActorCritic
  init_noise_std: 0.5
  actor_hidden_dims:
  - 128
  - 128
  critic_hidden_dims:
  - 128
  - 128
  activation: elu
algorithm:
  class_name: PPO
  value_loss_coef: 1.0
  use_clipped_value_loss: true
  clip_param: 0.2
  entropy_coef: 0.005
  num_learning_epochs: 5
  num_mini_batches: 4
  learning_rate: 0.001
  schedule: adaptive
  gamma: 0.99
  lam: 0.95
  desired_kl: 0.01
  max_grad_norm: 1.0
clip_actions: null
save_interval: 1000
experiment_name: anymal_c_navigation
run_name: ''
logger: tensorboard
neptune_project: isaaclab
wandb_project: isaaclab
resume: true
load_run: .*
load_checkpoint: logs/rsl_rl/anymal_c_navigation/2025-05-23_11-48-50/model_20000.pt
